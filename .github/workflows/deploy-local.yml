# Builds the extension and relaunches Chrome on your home laptop on every push.
# Requires a self-hosted GitHub Actions runner installed on the laptop.
#
# One-time runner setup (on the laptop):
#   1. GitHub repo → Settings → Actions → Runners → New self-hosted runner → Windows
#   2. Follow the download + configure steps shown (runs config.cmd)
#   3. Do NOT run the suggested ./svc.sh or install-svc command — that installs a
#      Windows service which runs in Session 0 and cannot launch visible Chrome windows.
#   4. Instead, open Task Scheduler and create a new task:
#        General:   Run only when user is logged on | Run with highest privileges
#        Trigger:   At log on → your user account
#        Action:    Start a program
#                   Program: C:\actions-runner\run.cmd   (wherever you extracted the runner)
#        Conditions: uncheck "Start only if on AC power"
#   5. Log off and back on — the runner will appear Online in GitHub.

name: Deploy to Local Runner

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build:fast

      - name: Write commit info
        shell: powershell
        run: |
          $sha = $env:GITHUB_SHA
          $shortSha = $sha.Substring(0, 8)
          $commitMsg = git log -1 --format="%s"
          $author = git log -1 --format="%an"
          $commitTimestamp = git log -1 --format="%aI"
          $dt = [DateTimeOffset]::Parse($commitTimestamp).UtcDateTime
          $fileTimestamp = $dt.ToString("yyyyMMdd-HHmmss")

          $outDir = "C:\Users\cyrus\Codex\refined-prun-commits"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $json = [ordered]@{
            sha           = $sha
            shortSha      = $shortSha
            branch        = $env:GITHUB_REF_NAME
            message       = $commitMsg
            author        = $author
            timestamp     = $commitTimestamp
            runId         = $env:GITHUB_RUN_ID
          } | ConvertTo-Json

          $json | Set-Content -Path "$outDir\${fileTimestamp}_${shortSha}.json" -Encoding UTF8

      - name: Restart Edge with new build
        shell: powershell
        run: |
          Stop-Process -Name msedge -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $edge = $null
          foreach ($path in @(
            "${env:PROGRAMFILES(X86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:PROGRAMFILES\Microsoft\Edge\Application\msedge.exe"
          )) {
            if (Test-Path $path) { $edge = $path; break }
          }
          if (-not $edge) { Write-Error "Edge not found"; exit 1 }

          $profile = "$env:LOCALAPPDATA\rprun-edge-profile"
          Remove-Item "$profile\SingletonLock" -Force -ErrorAction SilentlyContinue
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          Start-Process $edge -ArgumentList "--load-extension=$dist", "--user-data-dir=$profile", "https://apex.prosperousuniverse.com"
